name: Build and publish results site

on:
  push:
    branches: [codex/pages-results]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install figure dependencies
        run: Rscript -e 'install.packages(c("dplyr", "ggplot2", "gridExtra", "cowplot"), repos = "https://cloud.r-project.org")'
      - name: Render central figure and site
        run: Rscript .github/scripts/build-site.R
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
